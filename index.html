<!DOCTYPE html>
<html>
    <head>
        <title>SM | Accurant</title>
        <link rel="icon" type="image/x-icon" href="Accurant-Logo-Small.png">
        <style>
#mainTable {
  border: 2px solid #000;
  padding: 3px;
  border-collapse: collapse;
  font-size: medium;
  margin-right: 20px;
}


#mainTable tbody tr:nth-child(even) {
  background-color:rgb(251, 232, 211);
}

ul {
  list-style-type: none;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background-color: #eeeeee;
  width: 800px;
  margin-bottom: -2px;
}

li {
    display: block;
    text-align: center;
    text-decoration: none;
    float: left;
    padding: 6px 12px;
}

li:hover{
    background-color: #aaa;
}

li.active{
    background-color: rgb(243, 213, 144);
    border-top: 2px solid black;
    border-left: 2px solid black;
    border-right: 2px solid black;
}


.scroll-table{
    height: 450px; 
    width: 800px;
    overflow-y: auto;
    overflow-x: auto;
}

th, td{
    padding: 3px;
    white-space: nowrap;
}

td{
    padding-right: 20px;
}

th{
    padding: 5px;
    padding-right: 20px;

    text-align: left;
    position: sticky;
    top: -1px;

    background-color: rgb(243, 213, 144);
}
body{
    background-color: green;
    background-image: url("experimental.png"), url("experimental.png");
    background-position-x: 0,300px;
    background-position-y: 0, 150px;
    background-repeat: repeat, repeat;
}
input[type="search"]{
    font-size: larger;
}
select{
    font-size: large;
}

table{
    border: 2px solid #666;
    border-collapse: collapse;
}

h3{
    margin: 3px;
}

h1{
    background-color:rgb(255, 255, 255);
    color: rgb(0, 143, 38);
    font-size: 50px;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    padding: 6px;
    text-align: center;
    border: 4px solid #999;
}

button{
    font-size: x-large;
    font-weight: bold;
    border-width: 3px;
    border-radius: 5px;
    background-color: lightskyblue;
}

        </style>
    </head>
    <body>
        <table style="margin: auto; border: none;">
            <tr>
                <td style="padding: 20px; border: none; background-color: whitesmoke;">
                    <h1 style="margin-top: 0px;">Accurant Sample Manager</h1>
                    <table id="temp">
                        <tr>
                            <td>
                                <input type="file" id="fileInput">
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <input type="search" id="searchBar" oninput="updateTable()" placeholder="Search">
                            </td>
                            <td>
                                <h3>Filter By</h3>
                            </td>
                            <td>
                                <select id="selectFilter" onchange="updateTable()"></select>
                            </td>
                        </tr>
                    </table>
                    <table style="margin-top: -1.5px;">
                        <tr>
                            <td>
                                <h3>Sort By</h3>
                            </td>
                            <td>
                                <select id="selectSort" onchange="updateTable()"></select>
                            </td>
                            <td>
                                <select id="selectOrder" onchange="updateTable()"></select>
                            </td>
                        </tr>
                    </table>
                    <br><br>
                    <ul id="fileNavBar">
                    </ul>
                    <div class="scroll-table">
                        <table id="mainTable"></table>
                    </div>
                    <br><br>
                    <button onclick="RUN_AUTO_CROSSCHECK()">Run Cross Check</button>
                    <br><br>
                    <button onclick="downloadExcel()">Download selection as Excel</button>
                    <br><br><br><br>
                </td>
            </tr>
        </table>

        <script src="jquery-3.7.1.min.js"></script>
        <script src="xlsx.full.min.js"></script>
        <script src="string_comparator.js"></script>
        <script src="script.js"></script>

    </body>
</html>
